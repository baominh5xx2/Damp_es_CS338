DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
    N_DOMAIN: 0
    SAMPLER: RandomSampler
  TRAIN_U:
    BATCH_SIZE: 32
    N_DOMAIN: 0
    SAMPLER: RandomSampler
  TEST:
    BATCH_SIZE: 256
  NUM_WORKERS: 32 

DATASET:
  NAME: SYNTHIA
  SOURCE_DOMAINS:
    - synthia_train
  TARGET_DOMAINS:
    - cityscapes_train

INPUT:
  SIZE:
    - 224
    - 224
  PIXEL_MEAN:
    - 0.48145466
    - 0.4578275
    - 0.40821073
  PIXEL_STD:
    - 0.26862954
    - 0.26130258
    - 0.27577711
  INTERPOLATION: bicubic
  TRANSFORMS:
    - random_resized_crop
    - random_flip
    - normalize

MODEL:
  BACKBONE:
    NAME: ViT-B/16
    PATH: ""

OPTIM:
  NAME: sgd
  LR: 0.0008
  MAX_EPOCH: 3
  LR_SCHEDULER: cosine
  WARMUP_EPOCH: 1
  WARMUP_TYPE: linear
  WARMUP_MIN_LR: 1.0e-05

OPTIM_C:
  NAME: sgd
  LR: 0.0008
  MAX_EPOCH: 3
  LR_SCHEDULER: cosine
  WARMUP_EPOCH: 1
  WARMUP_TYPE: linear
  WARMUP_MIN_LR: 1.0e-05

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 1
  COUNT_ITER: train_x

TEST:
  SPLIT: test
  NO_TEST: false

TRAINER:
  NAME: DAMP
  DAMP:
    N_CTX: 16
    CSC: false
    PREC: amp
    TAU: 0.52
    PSEUDO_TEMP: 0.0
    U: 1.0
    STRONG_TRANSFORMS:
      - random_flip
      - randaugment
      - normalize

SEED: 1
USE_CUDA: true
OUTPUT_DIR: output/damp/synthia
